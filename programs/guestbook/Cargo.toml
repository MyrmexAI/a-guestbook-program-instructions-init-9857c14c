[package]
name = "guestbook"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []

[dependencies]
pinocchio = "0.9.2"
pinocchio-system = "0.3.0"

[dev-dependencies]
litesvm = "0.6.1"
solana-sdk = "2"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(target_os, values("solana"))']
